<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">강이 지나가는 동안</title>
<desc id="description">버스 창 가장자리 너머로 가로지르는 밤의 강. 멀리 낮은 다리의 네 불빛과 끊어진 색종이 같은 반영이 남는다. 08번 가상 노선의 강변을 상상한 독립 벡터 풍경.</desc>
