<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#9baeb8"/></marker></defs>
<rect width="1200" height="790" fill="#111e26"/>
<g font-family="sans-serif" fill="#e5edf0"><text x="55" y="60" font-size="28" font-weight="bold">RAIN CLOCK / MANUAL MECHANISM STUDY 01</text><text x="55" y="92" font-size="17" fill="#a7bac3">Axial separation, not a floating-ring illusion · dimensions in invented study mm</text>
<text x="55" y="145" font-size="20">A / SIDE STACK — FRONT AT LEFT</text>
<text x="55" y="174" font-size="14" fill="#a7bac3">Depth positions to scale; schematic parts are shown at different radial locations.</text>
<!-- x = 510 + 3Y; bead planes -94, -64; track planes -80, -50; canopy front -32 -->
<g stroke="#556e7d" stroke-dasharray="5 6"><path d="M228 200V445M270 200V445M318 200V445M360 200V445M414 200V445M675 200V445"/></g>
<rect x="214" y="250" width="28" height="62" rx="14" fill="#68b7b6"/>
<rect x="264" y="220" width="12" height="125" fill="#bb965b"/>
<path d="M228 281H270" stroke="#bb965b" stroke-width="5"/>
<rect x="304" y="250" width="28" height="62" rx="14" fill="#68b7b6"/>
<rect x="354" y="220" width="12" height="125" fill="#bb965b"/>
<path d="M318 281H360" stroke="#bb965b" stroke-width="5"/>
<rect x="414" y="300" width="216" height="18" fill="#bb965b"/>
<rect x="535" y="318" width="87" height="95" fill="#c78a54"/>
<rect x="666" y="205" width="18" height="220" fill="#476777"/>
<path d="M285 235H675M375 375H675" stroke="#688795" stroke-width="8"/>
<g fill="#e5edf0" font-size="13" text-anchor="middle"><text x="228" y="465">−94</text><text x="270" y="465">−80</text><text x="318" y="465">−64</text><text x="360" y="465">−50</text><text x="414" y="465">−32</text><text x="675" y="465">+55</text></g>
<g font-size="14" fill="#a7bac3"><text x="55" y="498">Inner beads / track</text><text x="275" y="498">Outer beads / track</text><text x="495" y="498">Canopy / rear support</text></g>
<path d="M366 210H414" stroke="#9baeb8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="390" y="195" text-anchor="middle" font-size="14" fill="#f0c991">16 mm minimum Y gap</text>
<text x="55" y="545" font-size="16">Moving geometry stays in front of the shelter for every Y-axis angle.</text>
<text x="55" y="574" font-size="14" fill="#a7bac3">This proves separation only—not stiffness, smooth running or safe hand use.</text>
<path d="M760 140V610" stroke="#314b5b"/>
<text x="800" y="145" font-size="20">B / GUIDE CONTACT</text>
<text x="800" y="174" font-size="14" fill="#a7bac3">Local cross-section, schematic only</text>
<!-- Groove U section -->
<path d="M830 230H900V305H1030V230H1100V380H830Z" fill="#688795"/>
<rect x="907" y="215" width="116" height="90" fill="#bb965b"/>
<text x="965" y="205" text-anchor="middle" font-size="15">4.0 mm track</text>
<path d="M900 405H1030" stroke="#9baeb8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="965" y="435" text-anchor="middle" font-size="15">4.4 mm groove</text>
<text x="800" y="478" font-size="16" fill="#f0c991">0.2 mm nominal per side</text>
<text x="800" y="507" font-size="14">NOT a validated tolerance.</text>
<text x="800" y="534" font-size="14" fill="#a7bac3">Roundness, axial runout, mounting</text>
<text x="800" y="558" font-size="14" fill="#a7bac3">error and debris can consume this gap.</text>
<rect x="55" y="625" width="1090" height="110" rx="10" fill="#223741"/>
<text x="75" y="656" font-size="17" fill="#f0c991">KEEP / CHANGE / NOT YET PROVEN</text>
<text x="75" y="685" font-size="15">Keep 19 beads. Inner radius 112 → 108 mm. Base depth 125 → 210 mm. No automatic phase linkage.</text>
<text x="75" y="712" font-size="15">Next: single-ring clearance/runout sweep. Bearings, retention, guards, hand force and stability remain untested.</text>
<text x="55" y="770" font-size="13" fill="#a7bac3">Local virtual design research · no purchases, fabrication, powered electronics or publication</text>
</g></svg>
