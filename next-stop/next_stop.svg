<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
<title id="title">다음 정거장</title>
<desc id="description">08번 버스를 타고 난 뒤 주머니에 남은 가상의 종이 승차권. 정류장의 창과 작은 빛, 시장길·강변·종점이 적혀 있다. 실제 교통권이 아닌 이야기 속 그래픽 작품.</desc>
